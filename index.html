<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 10px;
    }

    .alert {
      color: #e74c3c;
      font-weight: bold;
      font-size: 14px;
    }

    .steps {
      text-align: left;
      margin: 15px 0;
      font-size: 14px;
      color: #333;
    }

    .steps p {
      margin: 8px 0;
    }

    .btn {
      display: block;
      background: #2ea7d1;
      color: #fff;
      padding: 15px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }

    .btn-secondary {
      display: block;
      border: 2px solid #ccc;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      color: #333;
      margin-top: 8px;
    }

    .footer {
      font-size: 11px;
      color: #888;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>SIGA O PASSO A PASSO 👇</h2>

    <p class="alert">⚠️ Abra no navegador para continuar</p>

    <div class="steps">
      <p><strong>1)</strong> Toque nos três pontinhos no topo</p>
      <p><strong>2)</strong> Clique em "Abrir no navegador"</p>
      <p><strong>3)</strong> Depois toque no botão abaixo</p>
    </div>

    <a id="btn" href="#" class="btn">
      CONTINUAR
    </a>

    <a href="#" class="btn-secondary">
      NÃO CONSIGO ABRIR
    </a>

    <div class="footer">
      Redirecionamento seguro • Disponível por tempo limitado
    </div>
  </div>

  <script>
    const link = "https://apextry.com/go/vipbot1?utm_source=tiktok&utm_campaign=organico&utm_medium=bio&utm_content=perfil&utm_term=bot1&utm_id=tt001&code=tiktok";

    // Botão manual
    document.getElementById("btn").href = link;

    // Redirecionamento automático (leve atraso)
    setTimeout(() => {
      window.location.href = link;
    }, 1500);
  </script>

</body>
      </html>
